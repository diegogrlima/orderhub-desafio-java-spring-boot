spring:
  application:
    name: orderhub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderhub}
    username: ${DB_USER:orderhub}
    password: ${DB_PASSWORD:orderhub}
    hikari:
      maximum-pool-size: 20
      pool-name: orderhub-pool

  jpa:
    # Mantido como true por compatibilidade com o front-end legado (mapeamento ocorre nos controllers).
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${SERVER_PORT:8080}

orderhub:
  business:
    free-shipping-threshold: 500.00
    shipping-fee: 49.90
    late-fee-percent: 2.00
    monthly-interest-percent: 1.00
    max-installments: 6
    timezone: America/Sao_Paulo
  jobs:
    overdue-cron: "0 5 0 * * *"

logging:
  level:
    root: INFO
    br.com.valeverde.orderhub: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-45.45logger{44} : %m%n"
